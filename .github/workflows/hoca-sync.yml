name: Sync from hoca repo

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hoca-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # SYNC_TOKEN (a personal access token with the "workflow" scope) is needed when
          # the course repo changes files under .github/workflows; otherwise the built-in token is enough.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge hoca/main into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git remote add hoca https://github.com/volgasezen/di502.git
          git fetch hoca main
          if git merge-base --is-ancestor hoca/main HEAD; then
            echo "Already up to date with hoca/main. Nothing to do."
            exit 0
          fi
          git merge --no-edit hoca/main
          git push origin main
