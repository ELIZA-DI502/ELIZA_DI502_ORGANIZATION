<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="560" viewBox="0 0 1860 560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs>
<rect width="1860" height="560" fill="#ffffff"/>
<text x="20" y="42" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">NLP pipeline</text>
<rect x="20" y="70" width="1820" height="210" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<path d="M20 122 V80 Q20 70 30 70 H1830 Q1840 70 1840 80 V122 Z" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/>
<text x="44" y="105" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">1. Prepare the text<tspan font-weight="400" font-size="19" fill="#4b5563">   (once, before the system starts)</tspan></text>
<text x="1816" y="105" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#4b5563"></text>
<rect x="40.0" y="150" width="300" height="110" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="190.0" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">EUR-Lex text</text>
<text x="190.0" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4b5563">Regulation 2024/1689</text>
<text x="190.0" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6d28d9">HTML (D8)</text>
<path d="M344.0 205 H527.3333333333334" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m)"/>
<rect x="533.3333333333334" y="150" width="300" height="110" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="683.3333333333334" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">Split</text>
<text x="683.3333333333334" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4b5563">1 chunk = 1 point (a), (b), …</text>
<text x="683.3333333333334" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6d28d9">no points: 1 chunk = 1 paragraph (D7)</text>
<path d="M837.3333333333334 205 H1020.6666666666667" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m)"/>
<rect x="1026.6666666666667" y="150" width="300" height="110" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="1176.6666666666667" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">Embed</text>
<text x="1176.6666666666667" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4b5563">text → vector</text>
<text x="1176.6666666666667" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6d28d9">bge-m3 (D13)</text>
<path d="M1330.6666666666667 205 H1514.0" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m)"/>
<rect x="1520.0" y="150" width="300" height="110" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="1670.0" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">Store</text>
<text x="1670.0" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4b5563">vectors + metadata (Article no.)</text>
<text x="1670.0" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6d28d9">Chroma, cosine similarity (D11)</text>
<rect x="20" y="310" width="1820" height="230" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5"/>
<path d="M20 362 V320 Q20 310 30 310 H1830 Q1840 310 1840 320 V362 Z" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2.5"/>
<text x="44" y="345" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">2. Answer a question<tspan font-weight="400" font-size="19" fill="#4b5563">   (for every question)</tspan></text>
<text x="1816" y="345" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#4b5563"></text>
<rect x="40.0" y="400" width="300" height="110" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="190.0" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">Question</text>
<text x="190.0" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4b5563">from the user</text>
<path d="M344.0 455 H527.3333333333334" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m)"/>
<rect x="533.3333333333334" y="400" width="300" height="110" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="683.3333333333334" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">Dense search</text>
<text x="683.3333333333334" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4b5563">finds chunks by meaning</text>
<text x="683.3333333333334" y="496" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6d28d9">top 8 chunks (D12, D14)</text>
<path d="M837.3333333333334 455 H1020.6666666666667" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m)"/>
<rect x="1026.6666666666667" y="400" width="300" height="110" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="1176.6666666666667" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">LLM</text>
<text x="1176.6666666666667" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4b5563">writes the answer from the chunks</text>
<text x="1176.6666666666667" y="496" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6d28d9">Llama-3.1-8B (D9)</text>
<path d="M1330.6666666666667 455 H1514.0" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m)"/>
<rect x="1520.0" y="400" width="300" height="110" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="1670.0" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">Answer</text>
<text x="1670.0" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4b5563">with Article citations</text>
<path d="M1670.0 264 V330 H723.3333333333334 V396" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#m)"/>
<text x="739.3333333333334" y="384" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6d28d9">reads the stored chunks</text>
</svg>