# Product configuration (see the course's repository structure): only the chosen settings.
# The options that were tried are listed in the first code cell of src/embedding.ipynb (the experiment).
# Sprint 2: chunking (KAN-93), embedding and retrieval (KAN-97, KAN-221, KAN-99).
chunking:
  strategy: structure                                # one chunk per provision in data/provision-list.csv (D7)
  source_file: CELEX_02024R1689-20260727_EN.html     # SRC-02 in data/manifest.csv (D8)
  version_date: "27/07/2026"
  celex: "02024R1689-20260727"
  max_chars: 1500                                    # a longer provision is split at its points or lines

# Decisions D10-D12, chosen on the val questions in src/embedding.ipynb, Part 1.
embedding:
  model: BAAI/bge-m3                                 # step 6: best Recall@5 of five models (D10 had chosen bge-base on paper)
  remove_before_embedding: none                      # step 6b: removing jury words, frequent words or stopwords made the search worse
  query_instruction: "Represent this sentence for searching relevant passages: "   # only for the bge v1.5 models; bge-m3 uses none
vector_store:
  path: ../data/vector-store                         # D11, Chroma on disk with cosine distance (not committed; rebuilt by src/embedding.ipynb)
bm25:
  remove: stopwords                                  # step 5, scikit-learn list without "not", "no", "nor"; used only if dense_weight < 1.0
judge:
  url: http://localhost:11434/api/chat               # Ollama, for the LLM jury of step 4
  temperature: 0                                     # same answer every run
  num_predict: 2000                                  # room to finish thinking if Ollama cannot switch it off
retrieval:
  mode: dense                                        # step 6: dense alone beat every weighted hybrid (E1 baseline), D12
  dense_weight: 1.0                                  # weight of the dense list in weighted RRF; 1.0 = dense only
  top_k: 8                                           # step 7: highest Recall@k of 3, 5, 8 (D12)
  candidates: 20                                     # how many chunks each list gives to the fusion
  rrf_k: 60                                          # Reciprocal Rank Fusion constant
