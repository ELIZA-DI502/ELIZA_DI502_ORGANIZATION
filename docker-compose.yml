# ELIZA: the three containers of the design document (section 5, Deployment; D6, D15): web, rag, ollama.
# Only web publishes a port (localhost:3000); rag and ollama are on the internal Docker network.
# Before the first start: python rag/ingest.py (D5), see README.md, "Run the assistant".
name: eliza

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"                # WEB_PORT in .env if 3000 is already in use
    environment:
      RAG_URL: http://rag:8000
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-30}
      HISTORY_PAIRS: ${HISTORY_PAIRS:-3}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      RAG_TIMEOUT_S: ${RAG_TIMEOUT_S:-180}
    depends_on:
      rag:
        condition: service_healthy
    restart: unless-stopped

  rag:
    build:
      context: .
      dockerfile: rag/Dockerfile
    environment:
      # "no_rag" = the same LLM without retrieved provisions (baseline); "rag" = the full pipeline.
      DEFAULT_MODE: ${ELIZA_MODE:-rag}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
      LLM_TIMEOUT_S: ${RAG_TIMEOUT_S:-180}
      VECTOR_STORE_PATH: /app/data/vector-store
    volumes:
      - ./data/vector-store:/app/data/vector-store      # written once by rag/ingest.py on the host (D5)
      - hf-cache:/root/.cache/huggingface                # bge-m3 is downloaded once (about 2.3 GB)
    extra_hosts:
      - "host.docker.internal:host-gateway"             # only used when OLLAMA_URL points to the host's Ollama
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.15
    volumes:
      - ollama-models:/root/.ollama                      # the downloaded model files (Docker volume)
    expose:
      - "11434"
    restart: unless-stopped

volumes:
  ollama-models:
  hf-cache:
